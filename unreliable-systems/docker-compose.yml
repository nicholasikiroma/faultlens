x-timing: &timing
  SEND_TIMEOUT_MS: "2000"
  FAULT_DELAY_MS: "5000"
  PG_CONNECT_TIMEOUT_MS: "1000"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/wiresleuth.sql:/docker-entrypoint-initdb.d/wiresleuth.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # -h 127.0.0.1 is required. During init the temporary server listens on the Unix socket only, so a TCP check passes only after init.sql has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d lab"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  receiver:
    build: ./receiver
    environment:
      <<: *timing
      PORT: "3002"
      DATABASE_URL: postgres://lab:lab@postgres:5432/lab
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      retries: 30
  sender:
    build: ./sender
    environment:
      <<: *timing
      PORT: "3001"
      RECEIVER_URL: http://receiver:3002/webhooks
    ports:
      - "3001:3001"
    depends_on:
      receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      retries: 30

volumes:
  pgdata: {}
