x-backend-env: &backend-env
  DATABASE_URL: postgresql://lab:lab@postgres:5432/faultlens
  REDIS_URL: redis://redis:6379
  FAULTLENS_ADMIN_TOKEN: local-dev-admin-token
  FAULTLENS_WORKSPACE_ID: workspace-1
  FAULTLENS_ADMIN_ACTOR: local-admin
  FAULTLENS_API_HOST: 0.0.0.0
  FAULTLENS_API_PORT: "3000"
  FAULTLENS_AI_ENABLED: ${FAULTLENS_AI_ENABLED:-0}
  FAULTLENS_AI_AUTO_INVESTIGATE: ${FAULTLENS_AI_AUTO_INVESTIGATE:-1}
  FAULTLENS_AI_PROVIDER: ${FAULTLENS_AI_PROVIDER:-openai-compatible}
  FAULTLENS_AI_BASE_URL: ${FAULTLENS_AI_BASE_URL:-http://host.docker.internal:11434/v1}
  FAULTLENS_AI_MODEL: ${FAULTLENS_AI_MODEL:-qwen2.5:14b-instruct}
  FAULTLENS_AI_API_KEY: ${FAULTLENS_AI_API_KEY:-}
  FAULTLENS_AI_MAX_TOOL_CALLS: ${FAULTLENS_AI_MAX_TOOL_CALLS:-8}
  FAULTLENS_AI_TIMEOUT_MS: ${FAULTLENS_AI_TIMEOUT_MS:-60000}
  FAULTLENS_RETENTION_ENABLED: ${FAULTLENS_RETENTION_ENABLED:-0}
  FAULTLENS_RETENTION_METADATA_DAYS: ${FAULTLENS_RETENTION_METADATA_DAYS:-30}
  FAULTLENS_RETENTION_PAYLOAD_DAYS: ${FAULTLENS_RETENTION_PAYLOAD_DAYS:-7}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: faultlens
    volumes:
      - ./prisma/sql/incidents.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - faultlens_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d faultlens"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  seed:
    build: .
    command: ["npm", "run", "seed"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["npm", "run", "start:api"]
    environment:
      <<: *backend-env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/events',{headers:{authorization:'Bearer local-dev-admin-token'}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      retries: 30

  worker:
    build: .
    command: ["npm", "run", "start:worker"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  faultlens_pgdata: {}
